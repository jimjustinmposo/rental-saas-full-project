name = "rental-saas"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./frontend/build"

# ============================================================
# ENVIRONMENTS
# ============================================================

[env.production]
name = "rental-saas-prod"

[env.production.vars]
FRONTEND_URL = "https://yourdomain.com"
ADMIN_SIGNUP_PASSWORD = "your-admin-password"
JWT_SECRET = "your-jwt-secret-key"
NODE_ENV = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "rental-saas-db"
database_id = "74ab9451-08f6-44b2-a151-0938c8a928e5"

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "rental-saas-uploads"
jurisdiction = "eu"

[env.preview]
name = "rental-saas-preview"

[env.preview.vars]
FRONTEND_URL = "http://localhost:3000"
ADMIN_SIGNUP_PASSWORD = "dev-admin-password"
JWT_SECRET = "dev-jwt-secret-key"
NODE_ENV = "development"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "rental-saas-db"
database_id = "74ab9451-08f6-44b2-a151-0938c8a928e5"

[[env.preview.r2_buckets]]
binding = "BUCKET"
bucket_name = "rental-saas-uploads"
jurisdiction = "eu"

# ============================================================
# OBSERVABILITY
# ============================================================

[observability]
enabled = true

# For local development create a `.dev.vars` file with:
# FRONTEND_URL=http://localhost:3000
# ADMIN_SIGNUP_PASSWORD=fmc10123
# JWT_SECRET=your-dev-jwt-secret
# NODE_ENV=development
